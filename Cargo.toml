[workspace]
members = [
    "crates/crowd-core",
    "crates/crowd-bench",
    "crates/crowd-trace",
    "crates/crowd-blender",
    "crates/crowd-cache",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "1.0.0"
license = "GPL-3.0-or-later"

[workspace.dependencies]
blake3 = "1.8"
crc32c = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
proptest = "1"

[profile.release]
debug = true
