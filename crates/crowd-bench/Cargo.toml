[package]
name = "crowd-bench"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "crowd_bench"
path = "src/lib.rs"

[[bin]]
name = "crowd-bench"
path = "src/main.rs"

[[bin]]
name = "m6-interaction-worker"
path = "src/bin/m6_interaction_worker.rs"

[dependencies]
crowd-cache = { path = "../crowd-cache" }
crowd-core = { path = "../crowd-core" }
crowd-trace = { path = "../crowd-trace" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
jsonschema = { version = "0.33", default-features = false }
tempfile = "3.20"
